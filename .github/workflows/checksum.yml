name: Update APKBUILD checksums

on:
  pull_request:
    paths:
      - "**/APKBUILD"
  push:
    branches:
      - main
    paths:
      - "**/APKBUILD"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: checksum-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checksum:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Full history is unnecessary; a shallow checkout of the head is enough.
          # Pushing back to the same branch only needs the single commit.
      - name: Collect changed APKBUILDs
        id: targets
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            git fetch --no-tags --depth=1 origin "$base"
            files=$(git diff --name-only "$base" HEAD -- '*/APKBUILD' 'APKBUILD' || true)
          elif [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
            if git fetch --no-tags --depth=1 origin "$base" 2>/dev/null; then
              files=$(git diff --name-only "$base" HEAD -- '*/APKBUILD' 'APKBUILD' || true)
            else
              files=$(find . -name APKBUILD -type f | sed 's|^\./||')
            fi
          else
            files=$(find . -name APKBUILD -type f | sed 's|^\./||')
          fi
          # Keep only files that still exist (a PR may delete a package).
          existing=""
          for f in $files; do
            if [ -f "$f" ]; then
              existing="$existing $f"
            fi
          done
          # Space-separated list for the next step.
          echo "files=$existing" >> $GITHUB_OUTPUT
          echo "Targets:$existing"
      - name: Run abuild checksum
        if: steps.targets.outputs.files != ''
        env:
          # renovate: datasource=docker depName=alpine
          DOCKER_ALPINE_VERSION: "3.24"
        run: |
          for f in ${{ steps.targets.outputs.files }}; do
            # cloudflared uses a `case "$CARCH"` per-arch pattern which
            # `abuild checksum` corrupts (see dedicated step below).
            if [ "$f" = "cloudflared/APKBUILD" ]; then
              echo "Skipping $f here; handled by the cloudflared step."
              continue
            fi
            dir=$(dirname "$f")
            echo "=== abuild checksum in $dir ==="
            docker run --rm -i -v "$PWD/$dir:/pkg" -w /pkg alpine:${{ env.DOCKER_ALPINE_VERSION }} sh -c '
              set -e
              apk add --no-cache abuild
              abuild -F checksum
              # abuild leaves unpacked sources behind (owned by root);
              # clean them inside the container while we still can.
              rm -rf /pkg/src /pkg/pkg
            '
          done
          echo "=== git status after checksum ==="
          git status --short
      - name: Update cloudflared checksums
        # cloudflared/APKBUILD maps CARCH to upstream binary names via a
        # `case` statement, which `abuild checksum` does not understand
        # (it would hard-code a single arch and break the others).
        # Update the 5 inline hashes directly instead.
        if: contains(steps.targets.outputs.files, 'cloudflared/APKBUILD')
        run: |
          pkgver=$(grep -E '^pkgver=' cloudflared/APKBUILD | cut -d= -f2)
          echo "cloudflared pkgver=$pkgver"
          python3 - "$pkgver" <<'PY'
          import hashlib, re, sys, urllib.request
          pkgver = sys.argv[1]
          sums = {}
          for b in ("386", "amd64", "arm", "armhf", "arm64"):
              url = f"https://github.com/cloudflare/cloudflared/releases/download/{pkgver}/cloudflared-linux-{b}"
              print(f"fetching {url}", flush=True)
              with urllib.request.urlopen(url) as r:
                  sums[b] = hashlib.sha512(r.read()).hexdigest()
          p = "cloudflared/APKBUILD"
          t = open(p).read()
          # Each case line holds `_binarch=<name>; sha512sums="<hash>  cloudflared-linux-...`.
          t, n = re.subn(
              r"(_binarch=(386|amd64|arm|armhf|arm64); sha512sums=\")([0-9a-f]{128})(  cloudflared-linux-)",
              lambda m: m.group(1) + sums[m.group(2)] + m.group(4),
              t,
          )
          assert n == 5, f"expected 5 replacements, got {n}"
          open(p, "w").write(t)
          print("cloudflared checksums updated")
          PY
          git status --short
      - name: Push fixes to PR branch
        # Fork PRs use a read-only token; only show the diff there.
        if: steps.targets.outputs.files != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if git diff --quiet; then
            echo "Checksums are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Stage only checksummed APKBUILDs (tracked files modified above).
          git add -u
          git commit -m "Update APKBUILD checksums"
          git push origin "HEAD:$HEAD_REF"
      - name: Push fixes to main
        # Catches stale checksums merged to main before the PR bot ran.
        # [skip ci] prevents triggering this workflow again.
        if: steps.targets.outputs.files != '' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if git diff --quiet; then
            echo "Checksums are already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "Update APKBUILD checksums [skip ci]"
          git push origin "HEAD:main"
      - name: Fail on fork PRs with stale checksums
        if: steps.targets.outputs.files != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: |
          if git diff --quiet; then
            echo "Checksums are already up to date."
            exit 0
          fi
          echo "::error::APKBUILD checksums are stale. Run 'abuild checksum' locally and push."
          git diff
          exit 1
