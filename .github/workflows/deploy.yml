name: Deploy to Pages

on:
  schedule:
    - cron:  '0 17 * * *'
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  initialize:
    runs-on: ubuntu-latest
    steps:
      - name: REPOSITORY_NAMEの取得
        id: repository-name
        run: echo "repository-name=${GITHUB_REPOSITORY#${GITHUB_REPOSITORY_OWNER}/}" >> $GITHUB_OUTPUT
    outputs:
      repository-name: ${{ steps.repository-name.outputs.repository-name }}
  get-package-dirs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Package directoryの検索
        id: package-dirs
        # Sort alphabetically so that dependencies (e.g. c-icap) are
        # built before dependants (e.g. c-icap-modules).
        # Output is a space-separated list of paths relative to the repo root.
        run: |
          dirs=$(find . -maxdepth 2 -name APKBUILD -type f | xargs -n1 dirname | sed 's|^\./||' | sort | tr '\n' ' ')
          echo "package-dirs=$dirs" >> $GITHUB_OUTPUT
          echo "Found: $dirs"
    outputs:
      package-dirs: ${{ steps.package-dirs.outputs.package-dirs }}
  build:
    strategy:
      fail-fast: false
      matrix:
        apk-arch:
          - x86_64
          - aarch64
        include:
          - arch: amd64
            apk-arch: x86_64
            # Native runner: no QEMU emulation needed.
            runner: ubuntu-latest
          - arch: arm64
            apk-arch: aarch64
            # Native ARM runner: avoids slow QEMU emulation
            # (especially the Go build of dexidp).
            runner: ubuntu-24.04-arm
    needs:
      - initialize
      - get-package-dirs
    with:
      package-dirs: ${{ needs.get-package-dirs.outputs.package-dirs }}
      repository-name: ${{ needs.initialize.outputs.repository-name }}
      apk-arch: ${{ matrix.apk-arch }}
      arch: ${{ matrix.arch }}
      runner: ${{ matrix.runner }}
    uses: "./.github/workflows/build.yml"
    secrets: inherit
  prepare-pages:
    runs-on: ubuntu-latest
    needs:
      - build
      - initialize
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
      - name: Flatten repository layout
        # Each dist-* artifact contains <repo>/<arch>/*.apk + APKINDEX.
        # Merge them and move arch dirs to the Pages root so that users can use
        # https://<user>.github.io/<repo>/<arch> as an apk repository.
        run: |
          ls -R
          repo="${{ needs.initialize.outputs.repository-name }}"
          if [ -d "$repo" ]; then
            mv "$repo"/* .
            rmdir "$repo"
          fi
          ls -R
          # Ensure each arch has an index; fail early otherwise.
          for d in x86_64 aarch64; do
            if [ ! -f "$d/APKINDEX.tar.gz" ]; then
              echo "::error::Missing $d/APKINDEX.tar.gz"
              exit 1
            fi
          done
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # Upload entire repository
          path: '.'
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs:
      - prepare-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
