name: Build alpine packages
on:
  workflow_call:
    inputs:
      package-dirs:
        type: string
        required: true
      repository-name:
        type: string
        required: true
      apk-arch:
        type: string
        required: true
      arch:
        type: string
        required: true
      runner:
        type: string
        required: true
jobs:
  build:
    environment: Alpine packages
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 720
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
      - name: Set up QEMU
        # Only needed when emulating; native runners (e.g. ubuntu-24.04-arm
        # building linux/arm64) skip this entirely.
        if: ${{ (inputs.arch == 'amd64' && runner.arch != 'X64') || (inputs.arch == 'arm64' && runner.arch != 'ARM64') }}
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - name: Key
        env:
          PACKAGER_PRIVKEY: ${{ secrets.PACKAGER_PRIVKEY }}
          PACKAGER_PUBKEY: ${{ vars.PACKAGER_PUBKEY }}
        run: |
          mkdir -p ./keys ./packages
          echo "$PACKAGER_PRIVKEY" | base64 -d > ./keys/${{ vars.PACKAGER_KEYFILENAME }}
          chmod 600 ./keys/${{ vars.PACKAGER_KEYFILENAME }}
          echo "$PACKAGER_PUBKEY" | base64 -d > ./keys/${{ vars.PACKAGER_KEYFILENAME }}.pub
      - name: Build packages
        env:
          PACKAGER_PRIVKEY: ${{ secrets.PACKAGER_PRIVKEY }}
          PACKAGER_PUBKEY: ${{ vars.PACKAGER_PUBKEY }}
          # renovate: datasource=docker depName=alpine
          DOCKER_ALPINE_VERSION: "3.24"
        run: |
          docker run --platform linux/${{ inputs.arch }} --rm -i \
            -v $PWD/src:/${{ inputs.repository-name }}/${{ inputs.repository-name }} \
            -v $PWD/keys:/${{ inputs.repository-name }}/keys \
            -v $PWD/packages:/${{ inputs.repository-name }}/packages \
            alpine:${{ env.DOCKER_ALPINE_VERSION }} sh <<'EOF'
          set -e
          apk add alpine-sdk
          ABUILD_CONF="/etc/abuild.conf"
          if [ `grep -E "^PACKAGER=" $ABUILD_CONF | wc -l` == "0" ]; then echo 'PACKAGER="${{ vars.PACKAGER }}"' >> $ABUILD_CONF; fi
          if [ `grep -E "^MAINTAINER=" $ABUILD_CONF | wc -l` == "0" ]; then echo 'MAINTAINER="${{ vars.MAINTAINER }}"' >> $ABUILD_CONF; fi
          cp /${{ inputs.repository-name }}/keys/${{ vars.PACKAGER_KEYFILENAME }}.pub /etc/apk/keys/
          chmod 600 /${{ inputs.repository-name }}/keys/${{ vars.PACKAGER_KEYFILENAME }}
          if [ `grep -E "^PACKAGER_PRIVKEY=" $ABUILD_CONF | wc -l` == "0" ]; then echo 'PACKAGER_PRIVKEY=/${{ inputs.repository-name }}/keys/${{ vars.PACKAGER_KEYFILENAME }}' >> $ABUILD_CONF; fi
          DESTDIR=/${{ inputs.repository-name }}/packages
          if [ `grep -E "^REPODEST=" $ABUILD_CONF | wc -l` == "0" ]; then echo "REPODEST=$DESTDIR" >> $ABUILD_CONF; fi
          mkdir -p $DESTDIR
          # abuild derives the repository name from the parent directory of
          # the APKBUILD (aports layout: <aports>/<repo>/<pkgdir>), so the
          # checkout must live at /<repo>/<repo>/<pkgdir> for packages to
          # land in $REPODEST/<repo>/<arch>.
          LOCALREPO=$DESTDIR/${{ inputs.repository-name }}/${{ inputs.apk-arch }}
          mkdir -p $LOCALREPO
          # Initialise an (empty) local repository so that subsequently
          # built packages (e.g. c-icap for c-icap-modules) can be resolved
          # via `abuild -r`.
          cd $LOCALREPO
          # --rewrite-arch: abuild labels *-doc/*-openrc/etc packages as
          # noarch, but stores them in the $arch dir. The index must claim
          # them as $arch (like abuild's own update_abuildrepo_index does),
          # otherwise apk looks for them under <repo>/noarch/ and fails
          # with "package mentioned in index not found".
          apk index -o APKINDEX.tar.gz --rewrite-arch ${{ inputs.apk-arch }} *.apk || true
          # abuild-sign fails on an empty index; ignore until we have packages.
          abuild-sign -k /${{ inputs.repository-name }}/keys/${{ vars.PACKAGER_KEYFILENAME }} APKINDEX.tar.gz || true
          # Register the local repository. apk appends /<arch>/APKINDEX.tar.gz
          # itself, so register the repo root ($DESTDIR/<repo>), not the
          # arch subdirectory (registering the latter makes apk look for
          # <repo>/<arch>/<arch>/APKINDEX.tar.gz).
          if ! grep -qxF "$DESTDIR/${{ inputs.repository-name }}" /etc/apk/repositories; then echo "$DESTDIR/${{ inputs.repository-name }}" >> /etc/apk/repositories; fi
          apk update || true
          for pkgdir in ${{ inputs.package-dirs }}; do
            echo "=== Building $pkgdir for ${{ inputs.apk-arch }} ==="
            cd /${{ inputs.repository-name }}/${{ inputs.repository-name }}/$pkgdir
            # Self-heal stale checksums (e.g. after a Renovate pkgver bump
            # merged before the checksum workflow ran). No-op when already
            # correct. cloudflared is excluded: its case-$CARCH pattern is
            # not understood by `abuild checksum` (see checksum.yml).
            if [ "$pkgdir" != "cloudflared" ]; then
              abuild -F checksum
            fi
            abuild -r -F
            cd $LOCALREPO
            apk index -o APKINDEX.tar.gz --rewrite-arch ${{ inputs.apk-arch }} *.apk
            abuild-sign -k /${{ inputs.repository-name }}/keys/${{ vars.PACKAGER_KEYFILENAME }} APKINDEX.tar.gz
            apk update
          done
          EOF
      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ inputs.apk-arch }}
          retention-days: 1
          path: |
            packages/${{ inputs.repository-name }}
          overwrite: true
